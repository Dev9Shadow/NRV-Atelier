services:
  api:
    build: ./api
    container_name: nrv_api
    volumes:
      - ./api:/var/www/html
      - ./sql:/var/www/sql
    ports:
      - "55000:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nrv_db
      DB_USER: nrv_user
      DB_PASSWORD: nrv_password
    depends_on:
      - db
    restart: unless-stopped
    command: >
      bash -c "composer install --no-interaction &&
               a2enmod rewrite &&
               sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf &&
               apache2-foreground"

  front:
    image: nginx:alpine
    container_name: nrv_front
    volumes:
      - ./front:/usr/share/nginx/html
    ports:
      - "55001:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: nrv_db
    environment:
      POSTGRES_USER: nrv_user
      POSTGRES_PASSWORD: nrv_password
      POSTGRES_DB: nrv_db
    volumes:
      # Exécutés une seule fois, au premier démarrage (volume vide)
      - ./sql/nrv.schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/nrv.data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - nrv_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: nrv_adminer
    ports:
      - "55002:8080"
    restart: unless-stopped

volumes:
  nrv_db_data:
