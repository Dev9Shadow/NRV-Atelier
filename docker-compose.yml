services:
  api:
    build: ./api
    container_name: nrv_api
    volumes:
      - ./api:/var/www/html
      - ./sql:/var/www/sql
    ports:
      - "55000:80"
    env_file:
      - .env
    environment:
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - APP_DEBUG
      - JWT_SECRET
    depends_on:
      - db
    restart: unless-stopped
    command: >
      bash -c "composer install --no-interaction &&
               a2enmod rewrite &&
               sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf &&
               apache2-foreground"

  front:
    image: nginx:alpine
    container_name: nrv_front
    volumes:
      - ./front:/usr/share/nginx/html
    ports:
      - "55001:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: nrv_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - ./sql/nrv.schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/nrv.data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - nrv_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: nrv_adminer
    ports:
      - "55002:8080"
    restart: unless-stopped

volumes:
  nrv_db_data: