<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Connexion et inscription à NRV.net pour acheter vos billets du festival Nancy Rock Vibration.">
    <title>Connexion / Inscription - NRV</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="site-header">
        <a class="site-header__logo" href="index.html">NRV.net</a>
        <nav class="site-header__nav" aria-label="Navigation principale">
            <ul>
                <li><a href="index.html">Programme</a></li>
                <li><a href="panier.html">Panier</a></li>
            </ul>
        </nav>
    </header>
    <main class="connexion">
        <h1 class="titre-page">Mon compte</h1>
        <!-- Formulaire de Connexion -->
        <div class="form-container">
            <h2>Connexion</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" autocomplete="email" required>
                    <div id="login-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" autocomplete="current-password" required>
                </div>
                <button type="submit">Se connecter</button>
            </form>
        </div>

        <!-- Formulaire d'Inscription -->
        <div class="form-container">
            <h2>Inscription</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-nom">Nom</label>
                    <input type="text" id="register-nom" autocomplete="family-name" required>
                </div>
                <div class="form-group">
                    <label for="register-prenom">Prénom</label>
                    <input type="text" id="register-prenom" autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" autocomplete="email" required>
                    <div id="register-error" class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="register-password">Mot de passe</label>
                    <input type="password" id="register-password" autocomplete="new-password" required>
                </div>
                <button type="submit">S'inscrire</button>
            </form>
        </div>
    </main>

    <script type="module" src="js/header.js"></script>
    <script type="module" src="./js/connexion.js"></script>
</body>
</html>
